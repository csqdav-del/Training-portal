<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0284c7" opacity="0.1" stroke="#0284c7" stroke-width="2"/>

  <!-- Swimming (left) -->
  <g transform="translate(60, 100)">
    <!-- Swimmer -->
    <circle cx="0" cy="-12" r="5" fill="#0284c7" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Body and arms -->
    <path d="M 0 -6 Q -8 -2 -12 2" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 0 -6 Q 8 -2 12 2" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M -2 4 Q -4 8 -3 12" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 2 4 Q 4 8 3 12" stroke="#0284c7" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cycling (top right) -->
  <g transform="translate(130, 70)">
    <!-- Wheel 1 -->
    <circle cx="-8" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="2"/>
    <!-- Wheel 2 -->
    <circle cx="8" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="2"/>
    <!-- Frame -->
    <line x1="-8" y1="0" x2="0" y2="-8" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="8" y2="0" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="-8" y2="0" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <!-- Seat -->
    <circle cx="0" cy="-10" r="2" fill="#10b981"/>
  </g>

  <!-- Running (bottom right) -->
  <g transform="translate(130, 130)">
    <!-- Head -->
    <circle cx="0" cy="-8" r="4" fill="#ef4444"/>
    <!-- Torso -->
    <line x1="0" y1="-4" x2="0" y2="6" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left arm (running) -->
    <path d="M 0 0 Q -6 -3 -8 -2" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Right arm (running) -->
    <path d="M 0 0 Q 6 3 8 4" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Left leg -->
    <line x1="0" y1="6" x2="-4" y2="14" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right leg -->
    <line x1="0" y1="6" x2="4" y2="14" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Center circle with triathlon symbol -->
  <circle cx="100" cy="100" r="12" fill="#0284c7"/>
  <text x="100" y="107" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">T</text>
</svg>
